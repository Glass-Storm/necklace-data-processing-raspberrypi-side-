// ecosys.v1 — the FROZEN wire contract of the phone-manager device ecosystem.
//
// This single file is the contract spoken by three peers:
//   * the phone hub (this repo, Kotlin/JVM + Kotlin/Android, protobuf-lite)
//   * the smart-glasses app   (OUT OF SCOPE here — generated from this file)
//   * the Ubuntu daemon       (OUT OF SCOPE here — generated from this file)
//
// Rules for changing this file (the contract is frozen):
//   * never renumber or reuse a field number or enum value
//   * never change an existing field's type or name
//   * additive changes (new fields/messages/rpcs) are allowed and must be optional
//
// NOTE: `option java_multiple_files = true` splits generated types into
// one Java file per message. Kotlin lite codegen is configured separately in
// service/build.gradle.kts (protobuf-gradle-plugin `option("lite")`).
syntax = "proto3";

package ecosys.v1;

option java_multiple_files = true;

// Go codegen target. protoc-gen-go REFUSES to generate without a go_package
// (it cannot infer the import path), so this option is mandatory for the
// `tools/mockpeer` codegen — it is the Go counterpart of java_multiple_files.
// Kotlin/JVM codegen ignores it. Go peers may override with an `M` mapping.
option go_package = "phone-manager/tools/mockpeer/gen/ecosys/v1;ecosysv1";

// Which side of the ecosystem a paired peer is. Unspecified is the zero value
// so a default-constructed PairRequest never claims a role.
enum DeviceRole {
  DEVICE_ROLE_UNSPECIFIED = 0;
  DEVICE_ROLE_GLASS = 1;
  DEVICE_ROLE_DAEMON = 2;
}

// The kind of media carried by a stream. Unspecified is the zero value.
enum StreamKind {
  STREAM_KIND_UNSPECIFIED = 0;
  STREAM_KIND_AUDIO = 1;
  STREAM_KIND_VIDEO = 2;
}

// PairingService/Pair only. `pin` is the single-use 6-digit code shown by the
// hub inside an open pairing window. It is never sent on any other RPC.
message PairRequest {
  string pin = 1;
  string device_name = 2;
  DeviceRole role = 3;
}

// PairingService/Pair reply. On rejection `ok` is false and `reject_reason`
// carries a machine-checkable reason; `token`/`device_id` stay empty.
message PairResponse {
  bool ok = 1;
  string token = 2;
  string device_id = 3;
  string reject_reason = 4;
}

// PairingService/Heartbeat request. `device_id` identifies the paired peer.
message HeartbeatRequest {
  string device_id = 1;
}

// PairingService/Heartbeat reply. `server_time_ms` is the hub clock in
// milliseconds since the Unix epoch, used by peers to detect skew.
message HeartbeatResponse {
  bool ok = 1;
  int64 server_time_ms = 2;
}

// StreamService/OpenStream bootstrap frame. Sent by the peer as the first
// message on the bidi stream so the hub can bind the session to a device.
// Carried as the `stream_open` StreamFrame oneof member (field 10): with
// bearer-token auth removed, it is the only thing that tells the hub who is on
// the other end of a session and how to route frames.
message StreamOpenRequest {
  string device_id = 1;
  StreamKind kind = 2;
  // The peer's role, so the hub can route by role (glass vs. daemon/necklace).
  // Optional; an absent value is DEVICE_ROLE_UNSPECIFIED.
  DeviceRole role = 3;
}

// One recognized utterance returned to the peer.
message StreamResult {
  string text = 1;
  string speaker_label = 2;
  int64 pts_ms = 3;
}

// A single JPEG still captured by the necklace camera. The hub DECODES each
// image to run isolated gesture recognition; it never re-encodes or stores the
// bytes, and the payload stays opaque to every other layer.
message ImageFrame {
  bytes jpeg = 1;
  int64 pts_ms = 2;
  int32 width = 3;
  int32 height = 4;
}

// One recognized isolated gesture. `label` is the raw recognizer class and
// `text` is the spoken meaning; the hub emits this toward the glasses.
message GestureResult {
  string text = 1;
  string label = 2;
  float confidence = 3;
  int64 pts_ms = 4;
}

// Hub-synthesized speech as raw little-endian PCM16 mono @ 16 kHz, played by
// the necklace or the glasses. The hub never sends another sample rate.
message TtsAudio {
  bytes pcm16_16k = 1;
  int64 pts_ms = 2;
}

// A voiceprint enrollment request from the glasses: a display name plus a raw
// little-endian PCM16 mono @ 16 kHz sample. Enrollment rides the stream as a
// frame, so no new RPC (and no token) is introduced.
message EnrollRequest {
  string name = 1;
  bytes audio_pcm16_16k = 2;
  int64 pts_ms = 3;
}

// The hub's reply to an EnrollRequest. On rejection `ok` is false and `reason`
// carries a machine-checkable explanation.
message EnrollResponse {
  bool ok = 1;
  string reason = 2;
}

// A single frame on the bidirectional stream. Exactly one payload variant is
// set at a time (oneof).
//
// Frame opacity:
//   * audio (`audio_pcm16_16k`, and `tts_audio.pcm16_16k`) is raw little-endian
//     PCM16 mono @ 16 kHz that the hub NEVER decodes: it relays the bytes to the
//     STT engine or to a peer's speaker untouched.
//   * video (`video_h264_nal`) is an opaque H.264 NAL unit that the phone NEVER
//     decodes, re-encodes, transcodes, or renders.
//   * image (`image`) is the one media kind the hub DOES decode, into a bitmap,
//     solely to run isolated gesture recognition on the still.
message StreamFrame {
  oneof payload {
    bytes audio_pcm16_16k = 1;
    bytes video_h264_nal = 2;
    string transcript = 3;
    StreamResult result = 4;
    ImageFrame image = 5;
    GestureResult gesture = 6;
    TtsAudio tts_audio = 7;
    EnrollRequest enroll_request = 8;
    EnrollResponse enroll_response = 9;
    StreamOpenRequest stream_open = 10;
  }
}

// Pairing + liveness stubs. FROZEN and UNSERVED: the hub runtime serves neither
// rpc (auth and PIN pairing were removed from the runtime in v3). Both stay only
// for wire compatibility and must never be re-wired into the runtime.
service PairingService {
  rpc Pair(PairRequest) returns (PairResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// Bidirectional media + results relay. OpenStream is UNAUTHENTICATED: a peer binds
// its identity by sending a stream_open frame on the stream itself.
service StreamService {
  rpc OpenStream(stream StreamFrame) returns (stream StreamFrame);
}
